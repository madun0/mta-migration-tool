projectName: customer-portal
profile: standard
mta:
  # sources/targets are native MTA 8.3 technology selectors.
  # Confirm the installed CLI values with: mta-cli rules list-sources / list-targets
  sources:
    - eap7
  targets:
    - eap8
    - openjdk21
    - jakarta-ee
  # Supported values: source-only or full.
  mode: source-only
  # In full mode, also analyze dependencies MTA classifies as known open-source libraries.
  analyzeKnownLibraries: true
  # Optional: path to Maven settings used by MTA dependency resolution.
  mavenSettings: ""
  # Optional fallback for restricted/disconnected Maven-search environments.
  disableMavenSearch: false
validation:
  compileAfterFamily: true
  runTestsOnVerify: true
rewrite:
  dryRunBeforeApply: true
