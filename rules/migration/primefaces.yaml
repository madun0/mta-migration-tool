      pattern: "filterOptions\\s*="
  message: |
    PrimeFaces removed UIColumn filterOptions in PrimeFaces 13.
    Replace it with a filter facet/current DataTable filtering approach.
  tag:
    - PrimeFaces
    - DataTable
    - Filtering

- ruleID: primefaces-ui-data-type-0001
  category: mandatory
  effort: 2
  description: PrimeFaces UIData type was renamed
  labels:
    - konveyor.io/source=eap7
    - workbench.io/source-framework=primefaces6
    - konveyor.io/target=eap8
    - workbench.io/target-framework=primefaces16
  when:
    java.referenced:
      location: TYPE
      pattern: org.primefaces.component.api.UIData
  message: |
    PrimeFaces 15 renamed org.primefaces.component.api.UIData to PrimeUIData.
    Update custom components, subclasses, helpers, and imports that depend on this type.
  tag:
    - PrimeFaces
    - UIData
