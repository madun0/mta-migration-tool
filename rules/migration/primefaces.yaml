    builtin.filecontent:
      filePattern: "\\.java$"
      pattern: "\\.addElement\\s*\\("
  message: |
    If this call targets a PrimeFaces MenuModel, migrate away from the deprecated
    addElement() API and use the current menu-model element collection/builder APIs.
  tag:
    - PrimeFaces
    - Menu

- ruleID: primefaces-lazy-data-model-0001
  category: potential
  effort: 3
  description: LazyDataModel implementation requires migration review
  labels:
    - konveyor.io/source=eap7
    - workbench.io/source-framework=primefaces6
    - konveyor.io/target=eap8
    - workbench.io/target-framework=primefaces16
  when:
    java.referenced:
      location: IMPORT
      pattern: org.primefaces.model.LazyDataModel
  message: |
    LazyDataModel load signatures and sorting/filtering metadata changed in later
    PrimeFaces releases. Review every custom LazyDataModel implementation and
    adapt sort/filter arguments to the target PrimeFaces API.
  tag:
    - PrimeFaces
    - DataTable
    - LazyDataModel

- ruleID: primefaces-json-package-0001
  category: mandatory
  effort: 1
  description: Legacy PrimeFaces JSON package detected
  labels:
    - konveyor.io/source=eap7
    - workbench.io/source-framework=primefaces6
    - konveyor.io/target=eap8
    - workbench.io/target-framework=primefaces16
  when:
    java.referenced:
      location: PACKAGE
      pattern: org.primefaces.json.*
  message: |
    PrimeFaces moved org.primefaces.json to org.primefaces.shaded.json.
    Prefer application-owned JSON APIs when possible rather than depending
    on PrimeFaces internal/shaded JSON classes.
  tag:
    - PrimeFaces
    - JSON

- ruleID: primefaces-legacy-chart-model-0001
  category: mandatory
  effort: 4
  description: Legacy PrimeFaces chart model API detected
  labels:
    - konveyor.io/source=eap7
    - workbench.io/source-framework=primefaces6
    - konveyor.io/target=eap8
    - workbench.io/target-framework=primefaces16
  links:
    - title: PrimeFaces 12 to 13 migration guide
      url: https://github.com/primefaces/primefaces/blob/master/docs/migrationguide/13_0_0.md
  when:
    java.referenced:
      location: PACKAGE
      pattern: org.primefaces.model.chart.*
  message: |
    The legacy jqPlot Chart models were removed in PrimeFaces 13 in favor of
    newer chart support. Redesign these charts against the target PrimeFaces
    chart API and retest client-side options.
  tag:
    - PrimeFaces
    - Charts

- ruleID: primefaces-chart-component-review-0001
  category: potential
  effort: 2
  description: PrimeFaces chart view requires target-version review
  labels:
    - konveyor.io/source=eap7
    - workbench.io/source-framework=primefaces6
    - konveyor.io/target=eap8
    - workbench.io/target-framework=primefaces16
  when:
    builtin.filecontent:
      filePattern: "\\.xhtml$"
      pattern: "<p:chart"
  message: |
    A PrimeFaces chart component is present. The chart implementation and Java
    models changed substantially across the PrimeFaces 6.2-to-16 migration path.
    Correlate this view with its backing chart model and migrate them together.
  tag:
    - PrimeFaces
    - Charts
    - XHTML

- ruleID: primefaces-repeat-0001
  category: mandatory
  effort: 2
  description: p:repeat was removed
  labels:
    - konveyor.io/source=eap7
    - workbench.io/source-framework=primefaces6
    - konveyor.io/target=eap8
    - workbench.io/target-framework=primefaces16
  when:
    builtin.filecontent:
      filePattern: "\\.xhtml$"
      pattern: "<p:repeat"
  message: |
    PrimeFaces removed p:repeat in PrimeFaces 13. Replace it with ui:repeat
    and verify state-saving and iteration behavior.
  tag:
    - PrimeFaces
    - XHTML

- ruleID: primefaces-input-switch-0001
  category: mandatory
  effort: 2
  description: p:inputSwitch is removed in the target PrimeFaces line
  labels:
    - konveyor.io/source=eap7
    - workbench.io/source-framework=primefaces6
    - konveyor.io/target=eap8
    - workbench.io/target-framework=primefaces16
  links:
    - title: PrimeFaces 14 to 15 migration guide
      url: https://github.com/primefaces/primefaces/blob/master/docs/migrationguide/15_0_0.md
  when:
    builtin.filecontent:
      filePattern: "\\.xhtml$"
      pattern: "<p:inputSwitch"
  message: |
    InputSwitch was removed in PrimeFaces 15. Replace it with an appropriate
    supported boolean/toggle component in the target PrimeFaces version and
    retest value binding, Ajax behavior, styling, and accessibility.
  tag:
    - PrimeFaces
    - XHTML

- ruleID: primefaces-commons-fileupload-filter-0001
  category: mandatory
  effort: 2
  description: Legacy PrimeFaces Commons FileUpload filter detected
  labels:
    - konveyor.io/source=eap7
    - workbench.io/source-framework=primefaces6
    - konveyor.io/target=eap8
    - workbench.io/target-framework=primefaces16
  when:
    builtin.filecontent:
      filePattern: "web\\.xml$"
      pattern: "org\\.primefaces\\.webapp\\.filter\\.FileUploadFilter"
  message: |
    PrimeFaces 15 removed Apache Commons FileUpload support. Remove the legacy
    PrimeFaces FileUploadFilter configuration and migrate to native Servlet/Jakarta upload handling.
  tag:
    - PrimeFaces
    - FileUpload
    - web.xml

- ruleID: primefaces-old-fileupload-validation-attrs-0001
  category: potential
  effort: 2
  description: Legacy p:fileUpload validation attributes require migration
  labels:
    - konveyor.io/source=eap7
    - workbench.io/source-framework=primefaces6
    - konveyor.io/target=eap8
    - workbench.io/target-framework=primefaces16
  when:
    builtin.filecontent:
      filePattern: "\\.xhtml$"
      pattern: "(?s)<p:fileUpload\\b[^>]*\\b(sizeLimit|fileLimit|allowTypes)\\s*="
  message: |
    This p:fileUpload uses a legacy validation attribute.
    Move file validation configuration to a nested p:validateFile component
    and verify file size, file count, and file type validation behavior.
  tag:
    - PrimeFaces
    - FileUpload
    - Validation

