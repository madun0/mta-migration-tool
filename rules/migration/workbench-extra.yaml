- ruleID: primefaces-calendar-0001
  category: mandatory
  effort: 2
  description: Legacy PrimeFaces Calendar component detected
  labels:
    - konveyor.io/source=primefaces6
    - konveyor.io/target=primefaces16
  when:
    builtin.filecontent:
      filePattern: "\\.xhtml$"
      pattern: "<p:calendar"
  message: PrimeFaces Calendar requires migration to DatePicker and review of date/time semantics.
  tag: [PrimeFaces, Calendar, DatePicker]

- ruleID: primefaces-schedule-0001
  category: potential
  effort: 3
  description: PrimeFaces Schedule requires LocalDateTime migration
  labels:
    - konveyor.io/source=primefaces6
    - konveyor.io/target=primefaces16
  when:
    or:
      - builtin.filecontent:
          filePattern: "\\.xhtml$"
          pattern: "<p:schedule"
      - builtin.filecontent:
          filePattern: "\\.java$"
          pattern: "new\\s+DefaultScheduleEvent\\s*\\([^\\n,]+,[^\\n,]+,[^\\n,)]+"
      - builtin.filecontent:
          filePattern: "\\.java$"
          pattern: "loadEvents\\s*\\(\\s*(java\\.util\\.)?Date\\s+[^,]+,\\s*(java\\.util\\.)?Date\\s+"
  message: Review Schedule event/date APIs, view names, timezone and DST semantics.
  tag: [PrimeFaces, Schedule]

- ruleID: primefaces-timeline-0001
  category: potential
  effort: 3
  description: PrimeFaces Timeline requires LocalDateTime and builder migration
  labels:
    - konveyor.io/source=primefaces6
    - konveyor.io/target=primefaces16
  when:
    or:
      - builtin.filecontent:
          filePattern: "\\.xhtml$"
          pattern: "<p:timeline"
      - builtin.filecontent:
          filePattern: "\\.java$"
          pattern: "new\\s+TimelineEvent\\s*\\([^\\n,]+,[^\\n)]+"
  message: Review TimelineEvent construction, date types, timezone and deprecated attributes.
  tag: [PrimeFaces, Timeline]

- ruleID: primefaces-datatable-filter-api-0001
  category: potential
  effort: 2
  description: Legacy DataTable filter API may be in use
  labels:
    - konveyor.io/source=primefaces6
    - konveyor.io/target=primefaces16
  when:
    builtin.filecontent:
      filePattern: "\\.java$"
      pattern: "\\.(getFilters|setFilters)\\s*\\("
  message: PrimeFaces 8 removed DataTable getFilters/setFilters in favor of getFilterBy/setFilterBy.
  tag: [PrimeFaces, DataTable]

- ruleID: primefaces-facelet-functions-0001
  category: potential
  effort: 2
  description: Removed PrimeFaces Facelet helper function detected
  labels:
    - konveyor.io/source=primefaces6
    - konveyor.io/target=primefaces16
  when:
    builtin.filecontent:
      filePattern: "\\.xhtml$"
      pattern: "p:(component|widgetVar)\\s*\\("
  message: Migrate removed p:component()/p:widgetVar() helper functions to current PrimeFaces resolution functions.
  tag: [PrimeFaces, Facelets]

- ruleID: primefaces-watermark-client-api-0001
  category: potential
  effort: 1
  description: Removed PrimeFaces Watermark client API detected
  labels:
    - konveyor.io/source=primefaces6
    - konveyor.io/target=primefaces16
  when:
    builtin.filecontent:
      filePattern: "\\.(xhtml|js)$"
      pattern: "PrimeFaces\\.(cleanWatermarks|showWatermarks)\\s*\\("
  message: Watermark now uses placeholder behavior; remove obsolete cleanWatermarks/showWatermarks JavaScript calls.
  tag: [PrimeFaces, Watermark, JavaScript]
