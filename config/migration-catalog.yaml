version: '1.0'
recipeArtifactCoordinates: com.jackson.mta:primefaces-openrewrite-recipes:1.0.0-SNAPSHOT
rewritePluginVersion: 6.46.1
rewriteRepositoryUrl: ''
profiles:
  standard:
    description: Full guided migration from JSF 2.2 / PrimeFaces 6.2 toward JBoss EAP 8 / Jakarta Faces 4 / PrimeFaces 16.
    phases:
    - PREPARE
    - PRIMEFACES_CORE
    - PRIMEFACES_DATA
    - PRIMEFACES_COMPONENTS
    - MANUAL_REVIEW
    - FOUNDATION
    - PRIMEFACES_BASELINE
    - CLEANUP
    - VALIDATION
  primefaces-only:
    description: Run PrimeFaces modernization while the legacy PrimeFaces 6.2 / JSF source APIs are still resolvable. Legacy-type-aware
      source recipes run before the PrimeFaces 16 dependency upgrade.
    phases:
    - PRIMEFACES_CORE
    - PRIMEFACES_DATA
    - PRIMEFACES_COMPONENTS
    - MANUAL_REVIEW
    - PRIMEFACES_BASELINE
    - CLEANUP
    - VALIDATION
  assessment-only:
    description: Assessment and planning only. No source transformations.
    phases:
    - FOUNDATION
families:
  platform-baseline:
    description: Confirm the application build targets Java 21 and the supported JBoss EAP 8 / Jakarta EE 10 platform baseline
      before source modernization.
    phase: PREPARE
    automation: ASSISTED
    mtaRuleIds: []
    mtaRulePrefixes: []
    recipes:
    - com.jackson.mta.foundation.PlatformBaselineJava21
    cleanupRecipes: []
    guide: docs/FOUNDATION-MIGRATION.md
    forbiddenPatterns: []
    always: true
    reviewChecklist:
    - Confirm the application runs on the customer-approved JBoss EAP 8 release.
    - Confirm the build is configured for Java 21; defer compilation until the Jakarta foundation transformations are complete.
    - Review server-specific modules, JVM flags and deployment packaging that are outside source automation.
    compileAfterApply: false
  faces-managed-beans:
    description: Migrate removed JSF managed-bean, ManagedProperty and legacy JSF scope facilities to CDI/Jakarta Faces equivalents
      as one coherent task.
    phase: FOUNDATION
    automation: ASSISTED
    mtaRuleIds:
    - eap8-faces-00002
    - eap8-faces-00003
    - eap8-faces-00004
    - faces4-managed-bean-0001
    - faces4-managed-property-0001
    - faces4-legacy-scopes-0001
    mtaRulePrefixes: []
    recipes:
    - com.jackson.mta.foundation.MigrateFacesManagedBeans
    cleanupRecipes: []
    guide: docs/FOUNDATION-MIGRATION.md
    forbiddenPatterns:
    - javax.faces.bean.
    - jakarta.faces.bean.
    always: false
    reviewChecklist:
    - Replace remaining @ManagedBean annotations with CDI @Named; preserve explicit bean names where required by EL.
    - Replace @ManagedProperty with CDI @Inject or jakarta.faces.annotation.ManagedProperty + @Inject when EL-valued injection
      is required.
    - Verify ViewScoped beans implement Serializable and injected dependencies are passivation-capable where required.
    - Review eager managed-bean initialization; CDI @Named has no direct eager=true equivalent.
    - Run affected page and bean lifecycle tests after conversion.
    compileAfterApply: false
  jakarta-dependencies:
    description: Replace legacy javax Maven APIs with Jakarta EE equivalents and establish the Jakarta EE 10 provided compile
      baseline required for EAP 8 migration.
    phase: FOUNDATION
    automation: AUTOMATIC
    mtaRuleIds: []
    mtaRulePrefixes:
    - maven-javax-to-jakarta-
    - javax-to-jakarta-dependencies-
    recipes:
    - com.jackson.mta.foundation.MigrateJakartaDependencies
    cleanupRecipes: []
    guide: docs/FOUNDATION-MIGRATION.md
    forbiddenPatterns:
    - <groupId>javax.
    - <artifactId>javax.
    always: true
    reviewChecklist:
    - Verify the provided jakarta.platform:jakarta.jakartaee-api:10.0.0 compile baseline is compatible with the approved EAP 8 BOM/dependency-management strategy.
    - Review explicitly migrated Jakarta API dependencies and remove redundant versions when the target EAP BOM manages them.
    - Defer compilation until the Jakarta dependency, import, descriptor, and Faces source transformations for this phase
      have completed.
    compileAfterApply: false
  jakarta-imports:
    description: Migrate Java source imports from javax namespaces to their Jakarta equivalents where the API moved.
    phase: FOUNDATION
    automation: AUTOMATIC
    mtaRuleIds:
    - javax-to-jakarta-import-00001
    mtaRulePrefixes: []
    recipes:
    - com.jackson.mta.foundation.MigrateJavaxImports
    cleanupRecipes: []
    guide: docs/FOUNDATION-MIGRATION.md
    forbiddenPatterns:
    - import javax.faces.
    - import javax.validation.
    - import javax.annotation.
    - import javax.servlet.
    - import javax.persistence.
    always: false
    reviewChecklist:
    - Do not migrate Java SE javax packages such as javax.crypto, javax.net, javax.sql or javax.xml.parsers.
    - During phase validation, compile to identify removed Jakarta EE APIs that require semantic migration rather than package
      rename.
    compileAfterApply: false
